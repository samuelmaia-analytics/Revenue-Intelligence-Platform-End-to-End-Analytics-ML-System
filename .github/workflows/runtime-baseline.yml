name: Runtime Baseline

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version used to generate the baseline
        required: false
        default: "3.11"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-runtime-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip check

      - name: Generate runtime metrics
        run: python -m src.pipeline run --log-level INFO --data-dir ci_runtime_baseline_data

      - name: Update versioned runtime baseline
        run: python scripts/update_runtime_baseline.py ci_runtime_baseline_data/processed/runtime_metrics.json metrics/runtime_baseline.json

      - name: Verify runtime gate against refreshed baseline
        run: python scripts/assert_runtime_metrics.py ci_runtime_baseline_data/processed/runtime_metrics.json metrics/runtime_baseline.json

      - name: Upload refreshed runtime evidence
        uses: actions/upload-artifact@v5
        with:
          name: runtime-baseline-${{ github.run_id }}
          path: |
            ci_runtime_baseline_data/processed/runtime_metrics.json
            metrics/runtime_baseline.json

      - name: Open pull request with refreshed baseline
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh runtime baseline"
          branch: "automation/runtime-baseline-${{ github.run_id }}"
          delete-branch: true
          title: "chore: refresh runtime baseline"
          labels: |
            runtime
            docs
          assignees: samuelmaia
          reviewers: samuelmaia
          body: |
            ## Summary

            - What changed: refreshed `metrics/runtime_baseline.json` from the manual runtime baseline workflow
            - Why this change is needed: align the versioned runtime baseline with the validated runtime envelope after an intentional performance change
            - Which runtime path, contract, or operational concern it touches: CI runtime regression gate and runtime evidence

            ## Scope

            - Category: `chore`
            - Official batch path affected: `yes`
            - Streamlit affected: `no`
            - Warehouse behavior affected: `no`
            - Contracts affected: `no`

            ## Validation

            - [x] `python -m src.pipeline run --log-level INFO --data-dir ci_runtime_baseline_data`
            - [x] `python scripts/update_runtime_baseline.py ci_runtime_baseline_data/processed/runtime_metrics.json metrics/runtime_baseline.json`
            - [x] `python scripts/assert_runtime_metrics.py ci_runtime_baseline_data/processed/runtime_metrics.json metrics/runtime_baseline.json`

            ## Runtime Impact

            - Output artifacts affected: `metrics/runtime_baseline.json`
            - Manifest or runbook impact: baseline governance only
            - Backfill or retry behavior impact: none
            - Warehouse impact: none
            - Dashboard impact: none

            ## Tests Added or Updated

            - New or updated tests: workflow-driven baseline promotion only
            - Why these tests are sufficient: the workflow regenerates runtime evidence and validates the gate against the refreshed baseline
            - Residual risks: baseline approval remains a human review decision

      - name: Enable pull request auto-merge
        if: ${{ steps.create_pr.outputs.pull-request-number != '' }}
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
          merge-method: squash
