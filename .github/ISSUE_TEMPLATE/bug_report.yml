name: Bug report
description: Report a defect in the pipeline, warehouse outputs, runtime behavior, or repository tooling.
title: "[Bug] "
labels:
  - bug
  - runtime
  - triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect in one or two precise sentences.
      placeholder: The pipeline writes a success manifest even when artifact validation fails.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Batch runtime
        - Ingestion or transformation
        - Modeling or monitoring
        - Warehouse or dbt
        - API
        - Streamlit
        - CI, packaging, or developer tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide exact commands, inputs, dates, and environment details when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include traceback excerpts, manifest fields, SQL evidence, log snippets, or affected artifact names.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Technical impact
      description: Explain the reliability, maintenance, or user impact.
    validations:
      required: true
  - type: textarea
    id: containment
    attributes:
      label: Temporary containment or rollback
      description: If known, describe the safest short-term mitigation.
