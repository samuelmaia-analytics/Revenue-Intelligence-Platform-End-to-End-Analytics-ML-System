name: Documentation request
description: Request a documentation improvement where current guidance is unclear, incomplete, or misleading.
title: "[Docs] "
labels:
  - docs
  - triage
body:
  - type: textarea
    id: gap
    attributes:
      label: Documentation gap
      description: What is unclear, missing, or inaccurate today?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - README
        - Contributing guide
        - Architecture docs
        - Runtime or runbook docs
        - Repository structure docs
        - API docs
        - Release or governance docs
    validations:
      required: true
  - type: dropdown
    id: reader
    attributes:
      label: Primary reader
      options:
        - Hiring reviewer
        - New contributor
        - Tech lead
        - Operator or maintainer
        - API or dashboard consumer
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Explain how the current gap slows review, onboarding, operation, or maintenance.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe the documentation change that would close the gap.
  - type: textarea
    id: related_runtime
    attributes:
      label: Related commands, files, or artifacts
      description: Mention the commands, file paths, manifests, or outputs involved if applicable.
